name: Rabbit
description: >-
  Rabbit Inc. is a consumer technology company building AI-powered devices, best
  known for the Rabbit R1, a $199 handheld AI companion with industrial design by
  Teenage Engineering. The R1 runs rabbitOS and centers on a Large Action Model
  (LAM) that automates tasks across operating systems and applications (DLAM),
  alongside features like the Magic Camera, voice recording with transcription,
  and vibe-coded "creations." Rabbit is a portfolio company of a16z. As of this
  profile, Rabbit is a consumer hardware and device company with no publicly
  documented developer API, SDK, or developer portal; its public surface is a
  marketing site, support center, blog, and newsroom.
